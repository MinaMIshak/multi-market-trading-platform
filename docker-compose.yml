services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EGX_BUILD_REVISION: ${EGX_BUILD_REVISION:-}

    container_name: egx-platform-api

    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      TZ: Africa/Cairo
      EGX_DB_PATH: /app/data/platform.db
      EGX_SCHEDULER_HEARTBEAT_PATH: /app/data/scheduler-heartbeat.json
      EGX_SCAN_HISTORY_PATH: /app/data/egx-scan-history.json

    volumes:
      - ./data:/app/data

    mem_limit: 384m
    cpus: 1.0

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EGX_BUILD_REVISION: ${EGX_BUILD_REVISION:-}

    container_name: egx-platform-scheduler

    restart: unless-stopped

    command:
      [
        "python",
        "-m",
        "app.core.scheduler_worker"
      ]

    environment:
      TZ: Africa/Cairo
      EGX_DB_PATH: /app/data/platform.db
      EGX_SCHEDULER_HEARTBEAT_PATH: /app/data/scheduler-heartbeat.json
      EGX_SCAN_HISTORY_PATH: /app/data/egx-scan-history.json
      EGX_SCHEDULER_MODE: observe
      EGX_SCHEDULER_POLL_SECONDS: "30"
      EGX_CALENDAR_TRUTH: UNVERIFIED
      EODHD_API_TOKEN_FILE: /run/secrets/eodhd_api_token

    volumes:
      - ./data:/app/data
      - /opt/egx-runtime-secrets/eodhd_api_token:/run/secrets/eodhd_api_token:ro

    mem_limit: 128m
    cpus: 0.25
