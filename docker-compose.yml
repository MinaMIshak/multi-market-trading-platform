services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: egx-platform-api

    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      TZ: Africa/Cairo

    mem_limit: 384m
    cpus: 1.0

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
